<html lang="ja">
<head>

<meta name="description" content="The Coral Tides ワンマンライブ。2026年12月13日（土）桜坂劇場。開場18:00 / 開演19:00。前売3,500円 / 当日4,000円。この島で、この夜だけ。">

<style>
/* ============================================================
   Design tokens （index.html と同一構成／ライブ向けに暗色基調）
   ============================================================ */
:root {
  --accent:        #e8a020;   /* 琥珀 */
  --accent-strong: #ffc152;
  --accent-soft:   rgba(232, 160, 32, .13);

  --bg:            #14110c;
  --bg-elevated:   #1e1a13;
  --border:        #302920;
  --text:          #f3eee5;
  --text-muted:    #a89d8b;

  --radius:        14px;
  --shadow:        0 1px 2px rgba(0, 0, 0, .4),
                   0 10px 30px rgba(0, 0, 0, .35);
  --maxw:          720px;
}

/* OSがダークモードのときはさらに沈める */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:          #0b0906;
    --bg-elevated: #16120c;
    --border:      #27211a;
    --text:        #f6f2ea;
    --text-muted:  #b0a593;
  }
}

/* ============================================================
   Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI",
               "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.85;
  letter-spacing: .01em;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  position: relative;
  z-index: 1;
  width: min(100% - 2.5rem, var(--maxw));
  margin-inline: auto;
}

/* ============================================================
   Hero（.wrap の外・全幅。画像に文字を重ねる）
   ============================================================ */
.hero-media {
  position: relative;
  width: 100%;
}

/* 文字の可読性を確保する暗部グラデーション */
.hero-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top,
              rgba(0, 0, 0, .85) 0%,
              rgba(0, 0, 0, .3) 60%,
              transparent 100%);
  pointer-events: none;
}

.hero-image {
  display: block;
  width: 100%;
  height: clamp(400px, 60vw, 640px);
  object-fit: cover;
  object-position: center 30%;
}

/* 画像下部中央に重ねる。::after より前面に出すため z-index:1 */
.hero {
  position: absolute;
  z-index: 1;
  left: 1.25rem;
  right: 1.25rem;
  bottom: clamp(1.5rem, 4vw, 2.6rem);
  text-align: center;
}

.hero h1 {
  margin: 0;
  font-size: clamp(2.3rem, 9.5vw, 4.2rem);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -.02em;
  color: #fff;
  text-shadow: 0 2px 20px rgba(0, 0, 0, .6);
}

.tagline {
  margin: .7rem 0 0;
  font-size: clamp(1rem, 4vw, 1.3rem);
  font-weight: 700;
  color: var(--accent);
  text-shadow: 0 1px 14px rgba(0, 0, 0, .7);
}

.hero-date {
  margin: 1.1rem 0 0;
  font-size: clamp(.85rem, 3.4vw, .98rem);
  color: rgba(255, 255, 255, .9);
  text-shadow: 0 1px 10px rgba(0, 0, 0, .7);
}

.hero-date .sep {
  margin: 0 .5em;
  color: rgba(255, 255, 255, .4);
}

/* ---- カウントダウン ---- */
.countdown {
  display: inline-flex;
  align-items: baseline;
  gap: .55rem;
  margin: 1.3rem 0 0;
  padding: .55rem 1.4rem;
  border: 1px solid rgba(232, 160, 32, .45);
  border-radius: 999px;
  background: rgba(0, 0, 0, .45);
}

.countdown-label {
  font-size: .78rem;
  color: rgba(255, 255, 255, .8);
}

.countdown-value {
  font-size: clamp(1.05rem, 4.5vw, 1.35rem);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   Sections
   ============================================================ */
section { padding-block: clamp(2rem, 7vw, 3.2rem); }

.label {
  margin: 0 0 1.3rem;
  display: flex;
  align-items: center;
  gap: .8rem;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
}
.label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ============================================================
   Tickets
   ============================================================ */
.tickets {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.ticket {
  padding: 1.5rem 1.4rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  box-shadow: var(--shadow);
  text-align: center;
}

/* 前売りを目立たせる */
.ticket.is-advance { border-color: var(--accent); }

.ticket .type {
  display: block;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--text-muted);
}

.ticket .price {
  display: block;
  margin-top: .5rem;
  font-size: clamp(1.7rem, 7vw, 2.1rem);
  font-weight: 700;
  line-height: 1.2;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.ticket .note {
  display: block;
  margin-top: .3rem;
  font-size: .78rem;
  color: var(--text-muted);
}

.contact {
  margin: 1.1rem 0 0;
  font-size: .84rem;
  color: var(--text-muted);
  text-align: center;
}

.contact a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-soft);
}
@media (hover: hover) {
  .contact a:hover { border-bottom-color: var(--accent); }
}

/* ============================================================
   Access
   ============================================================ */
.access {
  padding: 1.6rem 1.5rem;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  box-shadow: var(--shadow);
}

.access .venue { margin: 0; font-size: 1.08rem; font-weight: 700; }
.access .address { margin: .3rem 0 0; font-size: .92rem; color: var(--text-muted); }

.map-link {
  display: inline-block;
  margin-top: 1.2rem;
  padding: .55rem 1.3rem;
  border-radius: 999px;
  background: var(--accent);
  color: #1a1206;
  font-size: .86rem;
  font-weight: 700;
  text-decoration: none;
  transition: background .2s ease;
}
@media (hover: hover) {
  .map-link:hover { background: var(--accent-strong); }
}

/* ============================================================
   Footer
   ============================================================ */
footer {
  padding: 3rem 0 3.5rem;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-muted);
  font-size: .78rem;
}

footer a { color: var(--accent); text-decoration: none; }
@media (hover: hover) {
  footer a:hover { text-decoration: underline; }
}

/* ============================================================
   Scroll reveal
   ============================================================ */
.reveal {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .6s ease, transform .6s ease;
}
.reveal.visible { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .map-link { transition: none; }
}
</style>
</head>

<body>

<!-- ============ HERO（.wrap の外。全幅画像に文字を重ねる）============ -->
<div class="hero-media">
  <img class="hero-image" src="images/live-hero.jpg" width="2200" height="1228"
       alt="ステージで演奏する The Coral Tides と客席のオーディエンス">
  <header class="hero">

    <p class="hero-date">
      <time datetime="2026-12-13">2026年12月13日（土）</time>

    </p>
    <p class="countdown">
      <span class="countdown-label" id="countdown-label">開演まで</span>

  </header>
</div>

<div class="wrap">

  <main>
    <!-- ============ TICKETS ============ -->
    <section aria-labelledby="ticket-label">
      <h2 class="label" id="ticket-label">Ticket</h2>
      <div class="tickets">
        <div class="ticket is-advance reveal">
          <span class="type">前売り</span>
          <span class="price">3,500円</span>
          <span class="note">税込・ドリンク別</span>
        </div>

        </div>

</div>

<script>
// ---- カウントダウン（開演＝2026-12-13 19:00 JST 固定）----
(function () {
  var el = document.getElementById('countdown-value');
  var label = document.getElementById('countdown-label');
  if (!el) return;

  // タイムゾーン付きで指定し、閲覧者の地域に関わらず同じ瞬間を指すようにする
  var target = new Date('2026-12-13T19:00:00+09:00');
  if (isNaN(target.getTime())) return;   // 解析失敗時は初期表示のまま

  var DAY = 86400000;
  var JST = 9 * 3600000;

  // 残り時間を24時間で割ると「前日20時」が0日になってしまうため、
  // JST のカレンダー日付どうしで差を取る（JST に夏時間は無い）
  function jstDayStart(ms) {
    return Math.floor((ms + JST) / DAY) * DAY - JST;
  }

  function render() {
    var now = Date.now();

    if (target.getTime() - now <= 0) {
      if (label) { label.textContent = ''; }
      el.textContent = 'ご来場ありがとうございました';
      return false;
    }

    var days = Math.round((jstDayStart(target.getTime()) - jstDayStart(now)) / DAY);
    if (days === 0) {
      if (label) { label.textContent = ''; }
      el.textContent = '本日開演';
    } else {
      if (label) { label.textContent = '開演まで'; }
      el.textContent = 'あと ' + days + ' 日';
    }
    return true;
  }

  if (render()) {
    // 日付をまたいだときに自然に切り替わるよう1分ごとに更新
    var timer = setInterval(function () {
      if (!render()) { clearInterval(timer); }
    }, 60000);
  }
})();

// ---- スクロールで順にフェードイン ----
(function () {
  var items = document.querySelectorAll('.reveal');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce || !('IntersectionObserver' in window)) {
    items.forEach(function (el) { el.classList.add('visible'); });
    return;
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry, i) {
      if (!entry.isIntersecting) return;
      setTimeout(function () { entry.target.classList.add('visible'); }, i * 90);
      io.unobserve(entry.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

  items.forEach(function (el) { io.observe(el); });
})();
</script>
